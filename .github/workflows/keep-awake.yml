# Render's free plan puts the server to sleep after 15 minutes with no visitors, and the next visitor waits
# 30–60 seconds while it wakes. This pings the health endpoint every 5 minutes so it stays awake.
# Only v2 (blindspot-pro) is pinged: one always-on free service uses ~720–744 hours a month, under Render's 750.
# November 2026 ran short on free hours, so pinging is paused until Dec 1 and the site sleeps when idle until then.
name: Keep the live demo awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the live site's /api/health (waits through a cold start)
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261201 ]; then
            echo "Paused until Dec 1 to save Render free hours."
            exit 0
          fi
          url=https://blindspot-pro.onrender.com
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url/api/health" || true)
            echo "$url attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
